async function ouvrir(){
  const mdp = document.getElementById('mdp').value;
  try{
    const raw = Uint8Array.from(atob(BLOB), c=>c.charCodeAt(0));
    const salt = raw.slice(0,16), nonce = raw.slice(16,28), ct = raw.slice(28);
    const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(mdp), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:200000, hash:'SHA-256'}, km,
      {name:'AES-GCM', length:256}, false, ['decrypt']);
    const clair = await crypto.subtle.decrypt({name:'AES-GCM', iv:nonce}, key, ct);
    document.getElementById('contenu').innerHTML = new TextDecoder().decode(clair);
    document.getElementById('porte').hidden = true;
  }catch(e){ document.getElementById('err').textContent = 'Mot de passe incorrect.'; }
}
document.getElementById('mdp').addEventListener('keydown', e=>{ if(e.key==='Enter') ouvrir(); });
</script>
